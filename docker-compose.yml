services:
  mariadb:
    image: mariadb:11
    container_name: hotel-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: hotel_db
    ports:
      - "3306:3306"
    volumes:
      - hotel_db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: hotel-backend
    depends_on:
      - mariadb
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/hotel_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: hotel-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  hotel_db_data:
