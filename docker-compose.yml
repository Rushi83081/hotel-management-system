services:
  mariadb:
    image: mariadb:11
    container_name: hotel-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: hotel_db
    ports:
      - "3306:3306"
    volumes:
      - hotel_db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: hotel-backend
    depends_on:
      - mariadb
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/hotel_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: hotel-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

  prometheus:
    image: prom/prometheus
    container_name: hotel-prometheus
    depends_on:
      - backend
      - node-exporter
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: hotel-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  node-exporter:
    image: prom/node-exporter
    container_name: hotel-node-exporter
    ports:
      - "9100:9100"
      
volumes:
  hotel_db_data:
  grafana_data:
